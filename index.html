<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#faf3f1" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#23202e" media="(prefers-color-scheme: dark)" />
  <title>Boundaries — A Minimalist Reader</title>
  <meta name="description" content="A quiet, minimalist online reader." />
  <meta property="og:title" content="Boundaries, A Minimalist Reader" />
  <meta property="og:description" content="A quiet, minimalist online reader." />
  <meta property="og:image" content="og-image.png" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-font="serif">
  <!-- reading progress -->
  <div class="progress" aria-hidden="true"><span class="progress__bar" id="progressBar"></span></div>

  <!-- top bar -->
  <header class="bar" id="bar">
    <button class="bar__btn" id="tocBtn" aria-label="Table of contents" aria-expanded="false" title="Contents">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5H21"/><path d="M3 12H21"/><path d="M3 19H21"/></svg>
    </button>
    <div class="bar__title" id="barTitle" title="Boundaries">Boundaries</div>
    <div class="bar__right">
      <button class="bar__btn" id="loadBtn" aria-label="Load your own book" title="Load your own book file">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 20L18 20"/><path d="M12 16V4M12 4L15.5 7.5M12 4L8.5 7.5"/></svg>
      </button>
      <button class="bar__btn" id="aaBtn" aria-label="Reading settings" aria-expanded="false" aria-controls="settings" title="Reading settings">
        <span class="aa">Aa</span>
      </button>
    </div>
  </header>

  <!-- settings popover -->
  <div class="pop" id="settings" role="dialog" aria-label="Reading settings" hidden>
    <div class="pop__row">
      <span class="pop__label">Theme</span>
      <div class="swatches" id="swatches">
        <button class="swatch" data-theme="blush" aria-pressed="false"><span class="swatch__chip" aria-hidden="true">Aa</span><span class="swatch__name">Blush</span></button>
        <button class="swatch" data-theme="sage" aria-pressed="false"><span class="swatch__chip" aria-hidden="true">Aa</span><span class="swatch__name">Sage</span></button>
        <button class="swatch" data-theme="mist" aria-pressed="false"><span class="swatch__chip" aria-hidden="true">Aa</span><span class="swatch__name">Mist</span></button>
        <button class="swatch" data-theme="butter" aria-pressed="false"><span class="swatch__chip" aria-hidden="true">Aa</span><span class="swatch__name">Butter</span></button>
        <button class="swatch" data-theme="lilac" aria-pressed="false"><span class="swatch__chip" aria-hidden="true">Aa</span><span class="swatch__name">Lilac</span></button>
        <button class="swatch" data-theme="dusk" aria-pressed="false"><span class="swatch__chip" aria-hidden="true">Aa</span><span class="swatch__name">Dusk</span></button>
      </div>
    </div>
    <div class="pop__row">
      <span class="pop__label">Type</span>
      <div class="seg" id="fontSeg">
        <button data-font="serif" class="is-on" aria-pressed="true">Serif</button>
        <button data-font="sans" aria-pressed="false">Sans</button>
      </div>
    </div>
    <div class="pop__row">
      <span class="pop__label">Size</span>
      <div class="seg" id="sizeSeg">
        <button data-size="s" aria-pressed="false">A−</button>
        <button data-size="m" class="is-on" aria-pressed="true">A</button>
        <button data-size="l" aria-pressed="false">A+</button>
        <button data-size="xl" aria-pressed="false">A++</button>
      </div>
    </div>
    <div class="pop__row">
      <span class="pop__label">Spacing</span>
      <div class="seg" id="spaceSeg">
        <button data-space="cozy" aria-pressed="false">Cozy</button>
        <button data-space="normal" class="is-on" aria-pressed="true">Normal</button>
        <button data-space="roomy" aria-pressed="false">Roomy</button>
      </div>
    </div>
  </div>

  <!-- contents drawer -->
  <aside class="toc" id="toc" role="dialog" aria-modal="true" aria-labelledby="tocTitle" hidden>
    <div class="toc__head">
      <span id="tocTitle">Contents</span>
      <button class="bar__btn" id="tocClose" aria-label="Close contents">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.75827 17.2426L12.0009 12M17.2435 6.75736L12.0009 12M12.0009 12L6.75827 6.75736M12.0009 12L17.2435 17.2426"/></svg>
      </button>
    </div>
    <nav class="toc__list" id="tocList"></nav>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <!-- main reading surface -->
  <main class="reader" id="reader">
    <!-- cover -->
    <section class="cover" id="cover">
      <h1 class="cover__title" id="coverTitle">Boundaries</h1>
      <p class="cover__sub" id="coverSub">Opening the book</p>
      <p class="cover__by" id="coverBy"></p>
      <button class="cover__cta" id="beginBtn" disabled>Begin reading</button>
      <p class="cover__resume" id="resumeLine" hidden></p>
    </section>

    <!-- chapter content injected here -->
    <article class="chapter" id="chapter" hidden></article>

    <!-- chapter footer nav -->
    <footer class="pager" id="pager" hidden>
      <button class="pager__btn" id="prevBtn" aria-label="Cover">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6L9 12L15 18"/></svg>
        <span class="pager__full" id="prevLabel">Previous</span>
        <span class="pager__short" id="prevShort">Previous</span>
      </button>
      <button class="pager__btn pager__btn--next" id="nextBtn" aria-label="Next">
        <span class="pager__full" id="nextLabel">Next</span>
        <span class="pager__short" id="nextShort">Next</span>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6L15 12L9 18"/></svg>
      </button>
    </footer>
  </main>

  <input type="file" id="fileInput" accept=".json,.txt" hidden />
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <!-- verse panel (popover on desktop, bottom sheet on mobile) -->
  <div class="vscrim" id="vscrim" hidden></div>
  <div class="verse" id="verse" role="dialog" aria-label="Scripture reference" hidden>
    <button class="verse__close" id="verseClose" aria-label="Close">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.75827 17.2426L12.0009 12M17.2435 6.75736L12.0009 12M12.0009 12L6.75827 6.75736M12.0009 12L17.2435 17.2426"/></svg>
    </button>
    <div class="verse__ref" id="verseRef"></div>
    <div class="verse__body" id="verseBody"></div>
    <div class="verse__note" id="verseNote">World English Bible, public domain</div>
  </div>

  <script src="pages.js"></script>
  <script src="app.js"></script>
</body>
</html>
